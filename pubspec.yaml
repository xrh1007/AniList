name: anilist
description: "AniList - 二次元作品追踪工具"
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.1
  provider: ^6.1.4
  image_picker: ^1.1.2
  flutter_svg: ^2.0.17
  shared_preferences: ^2.5.3
  file_picker: ^10.3.3
  lpinyin: ^2.0.3
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
